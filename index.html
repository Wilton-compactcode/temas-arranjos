<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Temas — Ordem de Prioridade</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3350;
      --text: #e8eaf0;
      --text2: #8b90a8;
      --accent: #5b7cf6;
      --never: #e05252;
      --old: #e07a30;
      --mid: #d4b84a;
      --ok: #4caf89;
      --new: #3a9e6a;
      --future: #7c7cde;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── HEADER ── */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px 10px;
    }

    header h1 {
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 0.3px;
      margin-bottom: 10px;
    }

    header h1 span { color: var(--accent); }

    .search-bar {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .search-bar input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      color: var(--text);
      font-size: 14px;
      outline: none;
    }

    .search-bar input::placeholder { color: var(--text2); }
    .search-bar input:focus { border-color: var(--accent); }

    .filter-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      color: var(--text2);
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }
    .filter-btn.active { border-color: var(--accent); color: var(--accent); }

    /* ── STATS ── */
    .stats-bar {
      display: flex;
      gap: 6px;
      padding: 8px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      font-size: 11px;
      color: var(--text2);
      overflow-x: auto;
    }

    .stat-chip {
      display: flex;
      align-items: center;
      gap: 4px;
      background: var(--surface2);
      border-radius: 20px;
      padding: 3px 9px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .stat-dot { width: 7px; height: 7px; border-radius: 50%; }

    /* ── LIST ── */
    .list-container { padding: 8px 0 80px; }

    .count-info {
      padding: 6px 16px;
      font-size: 11px;
      color: var(--text2);
    }

    .theme-card {
      display: flex;
      align-items: stretch;
      margin: 3px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }

    .theme-card:active { transform: scale(0.98); background: var(--surface2); }

    .priority-bar { width: 4px; flex-shrink: 0; }

    .card-body { flex: 1; padding: 10px 12px; min-width: 0; }

    .card-top {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    .rank { font-size: 11px; font-weight: 700; color: var(--text2); min-width: 22px; }

    .num-badge {
      background: var(--surface2);
      border-radius: 5px;
      padding: 1px 6px;
      font-size: 10px;
      font-weight: 600;
      color: var(--text2);
      flex-shrink: 0;
    }

    .titulo {
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text);
      line-height: 1.35;
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 5px;
      flex-wrap: wrap;
    }

    .date-pill {
      font-size: 11px;
      color: var(--text2);
      background: var(--surface2);
      border-radius: 4px;
      padding: 2px 7px;
    }

    .since-label {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 10px;
    }

    .all-dates {
      font-size: 10px;
      color: var(--text2);
      margin-left: auto;
      text-align: right;
      flex-shrink: 0;
    }

    .add-hint {
      font-size: 10px;
      color: var(--accent);
      margin-left: auto;
      opacity: 0.7;
    }

    /* priority colors */
    .p-never  { background: var(--never); }
    .p-old    { background: var(--old); }
    .p-mid    { background: var(--mid); }
    .p-ok     { background: var(--ok); }
    .p-new    { background: var(--new); }
    .p-future { background: var(--future); }

    .since-never  { background: rgba(224,82,82,0.18);  color: var(--never); }
    .since-old    { background: rgba(224,122,48,0.18); color: var(--old); }
    .since-mid    { background: rgba(212,184,74,0.18); color: var(--mid); }
    .since-ok     { background: rgba(76,175,137,0.18); color: var(--ok); }
    .since-new    { background: rgba(58,158,106,0.18); color: var(--new); }
    .since-future { background: rgba(124,124,222,0.18);color: var(--future); }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text2);
    }

    /* ── SCROLL TOP ── */
    #scrollTop {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 42px; height: 42px;
      background: var(--accent);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(91,124,246,0.4);
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 200;
    }
    #scrollTop.visible { opacity: 1; }

    /* ── MODAL OVERLAY ── */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 300;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }
    .overlay.open { opacity: 1; pointer-events: all; }

    /* ── BOTTOM SHEET ── */
    .sheet {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 400;
      background: var(--surface);
      border-radius: 20px 20px 0 0;
      border-top: 1px solid var(--border);
      padding: 0 0 env(safe-area-inset-bottom, 16px);
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.32,0.72,0,1);
      max-height: 92vh;
      overflow-y: auto;
    }
    .sheet.open { transform: translateY(0); }

    .sheet-handle {
      width: 36px; height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 12px auto 4px;
    }

    .sheet-header {
      padding: 10px 20px 14px;
      border-bottom: 1px solid var(--border);
    }

    .sheet-num {
      font-size: 11px;
      color: var(--text2);
      margin-bottom: 4px;
      font-weight: 600;
    }

    .sheet-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.4;
    }

    .sheet-section {
      padding: 16px 20px;
    }

    .sheet-section-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 10px;
    }

    /* Dates list inside modal */
    .dates-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 4px;
    }

    .date-chip {
      display: flex;
      align-items: center;
      gap: 5px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 10px;
      font-size: 12px;
      color: var(--text);
    }

    .date-chip.user-added {
      border-color: var(--accent);
      color: var(--accent);
    }

    .date-chip-remove {
      background: none;
      border: none;
      color: var(--never);
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      padding: 0 0 0 2px;
      opacity: 0.8;
    }

    .no-dates-msg {
      font-size: 13px;
      color: var(--text2);
      font-style: italic;
    }

    /* Picker row */
    .picker-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .picker-row select {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      color: var(--text);
      font-size: 15px;
      outline: none;
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
      text-align: center;
    }

    .picker-row select:focus { border-color: var(--accent); }

    .btn-add {
      background: var(--accent);
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.15s;
    }
    .btn-add:active { opacity: 0.8; }

    .btn-close {
      display: block;
      width: calc(100% - 40px);
      margin: 4px 20px 16px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 13px;
      color: var(--text2);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
    }
    .btn-close:active { opacity: 0.7; }

    .toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--surface2);
      border: 1px solid var(--accent);
      border-radius: 20px;
      padding: 8px 18px;
      font-size: 13px;
      color: var(--accent);
      z-index: 500;
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

// ─── DATE UTILS ──────────────────────────────────────────────────────────────
const MESES = {jan:1,fev:2,mar:3,abr:4,mai:5,jun:6,jul:7,ago:8,set:9,out:10,nov:11,dez:12};
const MONTHS_PT = ['','jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MONTHS_FULL = ['','Janeiro','Fevereiro','Março','Abril','Maio','Junho',
                     'Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

const NOW = new Date();
const TODAY_YEAR  = NOW.getFullYear();
const TODAY_MONTH = NOW.getMonth() + 1;
const TODAY_IDX   = TODAY_YEAR * 12 + TODAY_MONTH;

function parseDate(str) {
  if (!str) return null;
  const m = str.trim().match(/^([a-z]{3})-(\d{2})$/i);
  if (!m) return null;
  const mes = MESES[m[1].toLowerCase()];
  if (!mes) return null;
  let ano = parseInt(m[2]);
  ano = ano < 50 ? 2000 + ano : 1900 + ano;
  if (ano < 2010) return null;
  return { ano, mes, idx: ano * 12 + mes };
}

function lastPastDate(dates) {
  const parsed = dates.map(parseDate).filter(d => d && d.idx <= TODAY_IDX);
  if (!parsed.length) return null;
  return parsed.reduce((a, b) => b.idx > a.idx ? b : a);
}

function allValidDates(dates) {
  return dates.map(parseDate).filter(d => d !== null);
}

function fmtDate(d) {
  if (!d) return null;
  return `${MONTHS_PT[d.mes]}/${d.ano}`;
}

function sinceLabel(months) {
  if (months <= 0) return 'futuro';
  if (months < 12) return `${months}m atrás`;
  const anos = Math.floor(months / 12);
  const m = months % 12;
  return m === 0 ? `${anos}a atrás` : `${anos}a ${m}m`;
}

function priority(months) {
  if (months === null) return 'never';
  if (months <= 0)     return 'future';
  if (months < 12)     return 'new';
  if (months < 24)     return 'ok';
  if (months < 36)     return 'mid';
  return 'old';
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── LOCAL STORAGE ───────────────────────────────────────────────────────────
function loadUserDates() {
  try { return JSON.parse(localStorage.getItem('temas_user_dates') || '{}'); }
  catch { return {}; }

function saveUserDates(data) {
  localStorage.setItem('temas_user_dates', JSON.stringify(data));

// ─── BUILD ITEMS ─────────────────────────────────────────────────────────────
let userDates = loadUserDates();

function buildItems() {
  return RAW.map(r => {
    const extra = userDates[r.num] || [];
    const allD  = [...r.d, ...extra];
    const last   = lastPastDate(allD);
    const allParsed = allValidDates(allD);
    const months = last ? TODAY_IDX - last.idx : null;
    const prio   = priority(months);
    return { ...r, extra, last, allParsed, months, prio };
  });
}

function buildAndSort() {
  const items = buildItems();
  items.sort((a, b) => {
    if (a.months === null && b.months === null) return parseInt(a.num) - parseInt(b.num);
    if (a.months === null) return -1;
    if (b.months === null) return 1;
    return b.months - a.months;
  });
  return items;
}

// ─── POPULATE YEAR SELECT ────────────────────────────────────────────────────
(function() {
  const sel = document.getElementById('pickAno');
  const currentYear = TODAY_YEAR;
  for (let y = currentYear; y >= 2015; y--) {
    const opt = document.createElement('option');
    opt.value = String(y).slice(2);
    opt.textContent = y;
    if (y === currentYear) opt.selected = true;
    sel.appendChild(opt);
  }
  // Default month to current
  document.getElementById('pickMes').value = MONTHS_PT[TODAY_MONTH];
})();

// ─── MODAL STATE ─────────────────────────────────────────────────────────────
let activeNum = null;

function openSheet(num) {
  activeNum = num;
  const item = RAW.find(r => r.num === num);
  if (!item) return;

  document.getElementById('sheetNum').textContent = `Tema nº ${num}`;
  document.getElementById('sheetTitle').textContent = item.tema;

  renderSheetDates(num, item);

  document.getElementById('overlay').classList.add('open');
  document.getElementById('sheet').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function renderSheetDates(num, item) {
  const extra = userDates[num] || [];
  const el = document.getElementById('sheetDates');

  const origDates = allValidDates(item.d);
  const userParsed = allValidDates(extra);

  if (!origDates.length && !userParsed.length) {
    el.innerHTML = `<span class="no-dates-msg">Nenhuma data registrada</span>`;
    return;
  }

  const chips = [
    ...origDates.map(d => `<span class="date-chip">${MONTHS_FULL[d.mes]} ${d.ano}</span>`),
    ...extra.map(ds => {
      const d = parseDate(ds);
      const label = d ? `${MONTHS_FULL[d.mes]} ${d.ano}` : ds;
      return `<span class="date-chip user-added">
        ★ ${escHtml(label)}
        <button class="date-chip-remove" onclick="removeDate('${escHtml(num)}','${escHtml(ds)}')" title="Remover">×</button>
      </span>`;
    })
  ];

  el.innerHTML = chips.join('');
}

function closeSheet() {
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('sheet').classList.remove('open');
  document.body.style.overflow = '';
  activeNum = null;
}

function addDate() {
  if (!activeNum) return;
  const mes = document.getElementById('pickMes').value;
  const ano = document.getElementById('pickAno').value;
  const ds  = `${mes}-${ano}`;

  if (!userDates[activeNum]) userDates[activeNum] = [];

  // Prevent duplicates across all dates (original + user)
  const rawItem = RAW.find(r => r.num === activeNum);
  const allExisting = [...(rawItem ? rawItem.d : []), ...userDates[activeNum]];
  if (allExisting.includes(ds)) {
    showToast('Essa data já está registrada');
    return;
  }

  userDates[activeNum].push(ds);
  saveUserDates(userDates);

  const item = RAW.find(r => r.num === activeNum);
  renderSheetDates(activeNum, item);

  showToast('Data salva! ✓');
  rebuildList();
}

function removeDate(num, ds) {
  if (!userDates[num]) return;
  userDates[num] = userDates[num].filter(x => x !== ds);
  if (!userDates[num].length) delete userDates[num];
  saveUserDates(userDates);

  const item = RAW.find(r => r.num === num);
  renderSheetDates(num, item);
  rebuildList();
}

// ─── STATS ───────────────────────────────────────────────────────────────────
function updateStats(items) {
  const counts = {never:0, old:0, mid:0, ok:0, new:0};
  items.forEach(i => { if (i.prio in counts) counts[i.prio]++; });
  document.getElementById('cnt-never').textContent = counts.never + ' nunca';
  document.getElementById('cnt-old').textContent   = counts.old   + ' >3a';
  document.getElementById('cnt-mid').textContent   = counts.mid   + ' 2-3a';
  document.getElementById('cnt-ok').textContent    = counts.ok    + ' 1-2a';
  document.getElementById('cnt-new').textContent   = counts.new   + ' <1a';
}

// ─── RENDER LIST ─────────────────────────────────────────────────────────────
let showOnlyNever = false;
let searchTerm    = '';
let ITEMS         = [];

function rebuildList() {
  ITEMS = buildAndSort();
  updateStats(ITEMS);
  renderList();
}

function renderList() {
  const el   = document.getElementById('listEl');
  const info = document.getElementById('countInfo');

  const visible = ITEMS.filter(i => {
    if (showOnlyNever && i.months !== null) return false;
    if (searchTerm) {
      const q = searchTerm.toLowerCase();
      return i.tema.toLowerCase().includes(q) || i.num.includes(q);
    }
    return true;
  });

  info.textContent = `${visible.length} de ${ITEMS.length} temas`;

  if (!visible.length) {
    el.innerHTML = `<div class="empty-state"><p>Nenhum tema encontrado</p></div>`;
    return;
  }

  el.innerHTML = visible.map((item, idx) => {
    const p = item.prio;
    let sinceText, sinceCls;

    if (item.months === null) {
      sinceText = 'Nunca realizado';
      sinceCls  = 'since-never';
    } else if (item.months <= 0) {
      sinceText = 'Futuro';
      sinceCls  = 'since-future';
    } else {
      sinceText = sinceLabel(item.months);
      sinceCls  = `since-${p}`;
    }

    const lastStr  = item.last ? `${MONTHS_FULL[item.last.mes]} ${item.last.ano}` : '—';
    const hasExtra = item.extra && item.extra.length > 0;

    const allDStr = item.allParsed.length > 1
      ? item.allParsed.map(d => `${MONTHS_PT[d.mes]}/${d.ano}`).join(' · ')
      : '';

    return `<div class="theme-card" onclick="openSheet('${escHtml(item.num)}')">
      <div class="priority-bar p-${p}"></div>
      <div class="card-body">
        <div class="card-top">
          <span class="rank">#${idx + 1}</span>
          <span class="num-badge">${escHtml(item.num)}</span>
          <span class="titulo">${escHtml(item.tema)}</span>
        </div>
        <div class="card-meta">
          <span class="date-pill">${escHtml(lastStr)}</span>
          <span class="since-label ${sinceCls}">${sinceText}</span>
          ${hasExtra ? '<span style="font-size:10px;color:var(--accent)">★ editado</span>' : ''}
          ${allDStr ? `<span class="all-dates">${escHtml(allDStr)}</span>` : '<span class="add-hint">+ data</span>'}
        </div>
      </div>
    </div>`;
  }).join('');
}

// ─── TOAST ───────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// ─── CONTROLS ────────────────────────────────────────────────────────────────
function toggleFilter() {
  showOnlyNever = !showOnlyNever;
  document.getElementById('filterBtn').classList.toggle('active', showOnlyNever);
  renderList();
}

document.getElementById('searchInput').addEventListener('input', e => {
  searchTerm = e.target.value;
  renderList();
});

window.addEventListener('scroll', () => {
  document.getElementById('scrollTop').classList.toggle('visible', window.scrollY > 300);
}, {passive: true});

// ─── INIT ────────────────────────────────────────────────────────────────────
rebuildList();
</script>
